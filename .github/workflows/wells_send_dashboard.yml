name: Wells - Enviar Dashboard por Email

on:
  workflow_dispatch:
    inputs:
      email_destino:
        description: 'Email de destino (deixa vazio para usar o default)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  send-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4 openpyxl playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Criar config_email.py
        run: |
          EMAIL_DEST="${{ github.event.inputs.email_destino }}"
          if [ -z "$EMAIL_DEST" ]; then
            EMAIL_DEST="${{ secrets.EMAIL_TO }}"
          fi
          cat > config_email.py << PYEOF
          SMTP_HOST = "smtp.gmail.com"
          SMTP_PORT = 587
          SMTP_USER = "${{ secrets.SMTP_USER }}"
          SMTP_PASS = "${{ secrets.SMTP_PASS }}"
          EMAIL_TO  = "$EMAIL_DEST"
          PYEOF

      - name: Garantir que a pasta logs/ existe no repo
        run: |
          mkdir -p logs
          touch logs/.gitkeep

      - name: Correr o bot
        run: python wells_oos_monitor_ALL_BRANDS_AUTO_V5.py

      - name: Guardar histórico e ficheiros no repositório
        if: always()
        run: |
          git config user.name  "Wells Bot"
          git config user.email "wells-bot@github-actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          git add logs/ 2>/dev/null || true
          git add known_oos_*.json 2>/dev/null || true

          git diff --staged --quiet && echo "Nada novo para commitar" || \
            git commit -m "chore: run $(date +'%Y-%m-%d %H:%M') — histórico, dashboard e Excel atualizados"
          git pull --rebase origin main
          git push

      - name: Publicar dashboard no GitHub Pages
        if: always()
        run: |
          git config user.name  "Wells Bot"
          git config user.email "wells-bot@github-actions"
          if [ ! -f logs/dashboard_latest.html ]; then
            echo "Sem dashboard novo, nada a publicar."
            exit 0
          fi
          git fetch origin gh-pages
          rm -rf /tmp/ghpages
          git worktree add /tmp/ghpages origin/gh-pages
          cp logs/dashboard_latest.html /tmp/ghpages/index.html
          cd /tmp/ghpages
          git config user.name  "Wells Bot"
          git config user.email "wells-bot@github-actions"
          git add index.html
          git diff --staged --quiet && echo "Dashboard sem alteracoes" || \
            git commit -m "chore: atualiza dashboard $(date +'%Y-%m-%d %H:%M')"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:gh-pages
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/ghpages --force

      - name: Guardar dashboard como artefacto
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: dashboard-${{ github.run_id }}
          path: |
            logs/
            logs_consolidado/
            logs_*/
          retention-days: 7

      - name: Alerta por email se a run falhou
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          python3 - << 'PYEOF'
          import os, smtplib
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["Subject"] = f"[ALERTA] Wells Monitor FALHOU - {os.environ['WORKFLOW']}"
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg.set_content(
              "A run do Wells Online Monitor falhou e o email normal pode nao ter sido enviado.\n\n"
              f"Ver detalhes: {os.environ['RUN_URL']}\n"
          )
          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls()
              s.login(os.environ["SMTP_USER"], os.environ["SMTP_PASS"])
              s.send_message(msg)
          print("Email de alerta enviado.")
          PYEOF
