name: Wells - Enviar Dashboard por Email

on:
  workflow_dispatch:
    inputs:
      email_destino:
        description: 'Email de destino (deixa vazio para usar o default)'
        required: false
        default: ''

# Usa o mesmo grupo que o daily — nunca correm em simultâneo
concurrency:
  group: wells-monitor
  cancel-in-progress: false  # espera que o daily termine se estiver a correr

permissions:
  contents: write

jobs:
  send-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4 openpyxl playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Criar config_email.py
        run: |
          EMAIL_DEST="${{ github.event.inputs.email_destino }}"
          if [ -z "$EMAIL_DEST" ]; then
            EMAIL_DEST="${{ secrets.EMAIL_TO }}"
          fi
          cat > config_email.py << PYEOF
          SMTP_HOST = "smtp.gmail.com"
          SMTP_PORT = 587
          SMTP_USER = "${{ secrets.SMTP_USER }}"
          SMTP_PASS = "${{ secrets.SMTP_PASS }}"
          EMAIL_TO  = "$EMAIL_DEST"
          EMAIL_BCC = "${{ secrets.EMAIL_BCC }}"
          PYEOF

      - name: Correr o bot
        run: python wells_oos_monitor_ALL_BRANDS_AUTO_V4.py

      - name: Guardar histórico no repositório
        if: always()
        run: |
          git config user.name  "Wells Bot"
          git config user.email "wells-bot@github-actions"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          mkdir -p logs outputs
          git add -f logs/ outputs/ known_oos_*.json 2>/dev/null || true
          git add -f logs/historico.csv 2>/dev/null || true
          git status
          git diff --staged --quiet && echo "Sem alterações para guardar" && exit 0
          git commit -m "chore: histórico atualizado $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push

      - name: Guardar dashboard como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: outputs/*.html
          retention-days: 7
